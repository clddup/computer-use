[package]
name = "cu-platform-windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cu-core = { path = "../core" }
cu-protocol = { path = "../protocol" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_System_Com", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Security"] }
windows-capture = "1.5.0"
